<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobrit - Free Job Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Navbar -->
    <nav class="bg-white shadow p-4 flex justify-between items-center max-w-4xl mx-auto rounded-b-lg">
        <h1 class="text-xl font-bold text-blue-600">Jobrit</h1>
        <button onclick="openModal()" class="bg-blue-600 text-white px-4 py-2 rounded font-medium hover:bg-blue-700">Post a Job</button>
    </nav>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto p-4 mt-6">
        <h2 class="text-lg font-semibold mb-4 text-gray-700">Latest Job Listings</h2>
        <div id="jobList" class="space-y-3">
            <p class="text-gray-500">Loading jobs...</p>
        </div>
    </main>

    <!-- Post Job Modal -->
    <div id="jobModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-lg max-w-md w-full shadow-lg relative">
            <button onclick="closeModal()" class="absolute top-3 right-3 text-gray-500 font-bold text-xl">&times;</button>
            <h3 class="text-lg font-bold mb-4">Post a New Job</h3>
            <form id="jobForm" onsubmit="postJob(event)" class="space-y-3">
                <input type="text" id="title" placeholder="Job Title (e.g. Python Developer)" required class="w-full border p-2 rounded text-sm">
                <input type="text" id="company" placeholder="Company Name" required class="w-full border p-2 rounded text-sm">
                <input type="text" id="location" placeholder="Location (e.g. Remote / Delhi)" required class="w-full border p-2 rounded text-sm">
                <select id="type" class="w-full border p-2 rounded text-sm">
                    <option value="Full-Time">Full-Time</option>
                    <option value="Contract">Contract</option>
                    <option value="Remote">Remote</option>
                </select>
                <textarea id="description" placeholder="Job Description..." rows="3" required class="w-full border p-2 rounded text-sm"></textarea>
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-2 rounded font-medium hover:bg-blue-700">Submit</button>
            </form>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const SUPABASE_URL = 'https://fksiepwvbygkcojvjyzy.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_nZ04GQ7-N30fI3xe67AOKw_tyd-9Xam';
        
        // Using var to avoid initialization timing issues
        var _client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function fetchJobs() {
            const listDiv = document.getElementById('jobList');
            const { data, error } = await _client.from('jobs').select('*').order('created_at', { ascending: false });

            if (error) {
                listDiv.innerHTML = `<p class="text-red-500">Error loading jobs: ${error.message}</p>`;
                return;
            }

            if (!data || data.length === 0) {
                listDiv.innerHTML = `<p class="text-gray-500">No jobs posted yet. Be the first to post!</p>`;
                return;
            }

            listDiv.innerHTML = data.map(job => `
                <div class="bg-white p-4 rounded shadow border border-gray-200">
                    <h3 class="font-bold text-blue-600 text-lg">${job.title}</h3>
                    <p class="text-sm text-gray-700 font-medium">${job.company} • ${job.location} <span class="ml-2 px-2 py-0.5 bg-blue-50 text-blue-600 text-xs rounded">${job.type}</span></p>
                    <p class="text-sm text-gray-600 mt-2">${job.description}</p>
                </div>
            `).join('');
        }

        function openModal() { document.getElementById('jobModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('jobModal').classList.add('hidden'); }

        async function postJob(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'Posting...';

            const newJob = {
                title: document.getElementById('title').value,
                company: document.getElementById('company').value,
                location: document.getElementById('location').value,
                type: document.getElementById('type').value,
                description: document.getElementById('description').value
            };

            const { error } = await _client.from('jobs').insert([newJob]);

            if (error) {
                alert('Error: ' + error.message);
            } else {
                alert('🎉 Job posted successfully!');
                closeModal();
                document.getElementById('jobForm').reset();
                fetchJobs();
            }

            btn.disabled = false;
            btn.innerText = 'Submit';
        }

        // Load jobs when page opens
        fetchJobs();
    </script>
</body>
</html>
