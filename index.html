<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobrit Pro - Indeed Style Job Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="bg-white shadow-sm border-b sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-600 flex items-center gap-2 cursor-pointer" onclick="resetFilters()">
                💼 Jobrit <span class="text-xs bg-blue-100 text-blue-800 font-semibold px-2 py-0.5 rounded">Pro</span>
            </h1>
            <div class="flex items-center gap-3">
                <button onclick="openModal()" class="bg-blue-600 text-white font-medium px-4 py-2 rounded-lg hover:bg-blue-700 transition flex items-center gap-1 shadow-sm text-sm">
                    + Post a Job
                </button>
            </div>
        </div>
    </header>

    <!-- Search & Filter Bar Section -->
    <section class="bg-blue-600 py-6 px-4 shadow-inner">
        <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-3">
            <input type="text" id="search-title" oninput="filterJobs()" placeholder="Job title, keywords, or company" class="bg-white border rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 shadow-sm">
            <input type="text" id="search-location" oninput="filterJobs()" placeholder="City, state, or 'Remote'" class="bg-white border rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 shadow-sm">
            <select id="filter-type" onchange="filterJobs()" class="bg-white border rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 shadow-sm">
                <option value="">All Job Types</option>
                <option value="Full-Time">Full-Time</option>
                <option value="Part-Time">Part-Time</option>
                <option value="Contract">Contract</option>
                <option value="Remote">Remote</option>
            </select>
        </div>
    </section>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-gray-800">Recommended Jobs</h2>
            <span id="job-count" class="text-sm text-gray-500 font-medium">Loading jobs...</span>
        </div>

        <!-- Job Listings Container -->
        <div id="job-list" class="space-y-4">
            <!-- Jobs dynamically inserted here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t py-4 text-center text-xs text-gray-500 mt-12">
        &copy; 2026 Jobrit Pro. Built for seamless engineering & tech hiring.
    </footer>

    <!-- Post / Edit Job Modal -->
    <div id="job-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 id="modal-title" class="text-lg font-bold text-gray-800">Post a New Job</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
            </div>

            <form id="job-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="job-id">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Job Title</label>
                    <input type="text" id="job-title-input" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g. Senior Software Engineer">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Company Name</label>
                        <input type="text" id="job-company" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g. ACL Digital">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Location</label>
                        <input type="text" id="job-location" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g. Noida / Remote">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Job Type</label>
                    <select id="job-type" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="Full-Time">Full-Time</option>
                        <option value="Part-Time">Part-Time</option>
                        <option value="Contract">Contract</option>
                        <option value="Remote">Remote</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">
                        Job Description (Use **text** for bold headings)
                    </label>
                    <textarea id="job-description" rows="6" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none font-sans" placeholder="**Requirements:**&#10;• Experience with JavaScript & Tailwind&#10;• Good communication skills"></textarea>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-lg text-sm text-gray-600 hover:bg-gray-50">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700">Save Job</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Apply Job Modal -->
    <div id="apply-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="text-lg font-bold text-gray-800">Apply for <span id="apply-job-title" class="text-blue-600"></span></h3>
                <button onclick="closeApplyModal()" class="text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
            </div>
            <form id="apply-form" onsubmit="submitApplication(event)" class="space-y-4">
                <input type="hidden" id="apply-job-id">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Full Name</label>
                    <input type="text" id="applicant-name" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g. Rahul Kumar">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
                    <input type="email" id="applicant-email" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="rahul@example.com">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Resume Link (Google Drive / LinkedIn / PDF URL)</label>
                    <input type="url" id="applicant-resume" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="https://drive.google.com/file/d/...">
                </div>
                <div class="flex justify-end gap-3 pt-4 border-t">
                    <button type="button" onclick="closeApplyModal()" class="px-4 py-2 border rounded-lg text-sm text-gray-600 hover:bg-gray-50">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700">Submit Application</button>
                </div>
            </form>
        </div>
    </div>

    <!-- View Applications Modal -->
    <div id="applications-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-3xl w-full p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="text-lg font-bold text-gray-800">Applications Received</h3>
                <button onclick="closeApplicationsModal()" class="text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
            </div>
            <div id="applications-list" class="space-y-3">
                <!-- Applications inserted dynamically -->
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const SUPABASE_URL = "https://fksiepwvbygkcojvjyzy.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZrc2llcHd2Ynlia2NvanZqeXp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyMTI3MDIsImV4cCI6MjA1Njc4ODcwMn0.J6k8RkK6E_L0kZk_L9s1F1V8S_s1F1V8S_s1F1V8S";
        
        let supabaseClient = null;
        if (window.supabase) {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        let jobsList = [];
        let applicationsList = [];

        document.addEventListener("DOMContentLoaded", () => {
            fetchJobs();
            fetchApplications();
        });

        async function fetchJobs() {
            const listEl = document.getElementById("job-list");
            listEl.innerHTML = `<div class="text-center py-8 text-gray-500">Loading listings...</div>`;

            try {
                if (supabaseClient) {
                    const { data, error } = await supabaseClient
                        .from("jobs")
                        .select("*")
                        .order("created_at", { ascending: false });
                    if (!error && data) jobsList = data;
                }
            } catch (e) {
                console.warn("Supabase fallback:", e);
            }
            renderJobs(jobsList);
        }

        async function fetchApplications() {
            try {
                if (supabaseClient) {
                    const { data } = await supabaseClient.from("applications").select("*");
                    if (data) applicationsList = data;
                }
            } catch(e) {
                console.log("App fetch warning:", e);
            }
        }

        function renderJobs(jobs) {
            const listEl = document.getElementById("job-list");
            const countEl = document.getElementById("job-count");
            countEl.textContent = `${jobs.length} Job(s) Available`;

            if (jobs.length === 0) {
                listEl.innerHTML = `
                    <div class="bg-white rounded-xl p-8 text-center border text-gray-500 shadow-sm">
                        No jobs found. Try adjusting filters or click "+ Post a Job"!
                    </div>`;
                return;
            }

            listEl.innerHTML = jobs.map(job => {
                const isHeld = job.status === 'hold';
                const appCount = applicationsList.filter(a => a.job_id == job.id).length;
                return `
                <div class="bg-white rounded-xl shadow-sm border p-6 transition hover:shadow-md ${isHeld ? 'opacity-60 bg-gray-50' : ''}">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <h3 class="text-xl font-bold text-blue-600">${escapeHtml(job.title)}</h3>
                            <p class="text-sm font-semibold text-gray-700 mb-1">
                                ${escapeHtml(job.company)} • <span class="text-gray-500 font-normal">${escapeHtml(job.location)}</span>
                            </p>
                        </div>
                        <span class="text-xs px-2.5 py-1 bg-blue-50 text-blue-700 font-semibold rounded-full border border-blue-200">
                            ${escapeHtml(job.type || 'Full-Time')}
                        </span>
                    </div>

                    <div class="text-gray-600 text-sm mb-6 whitespace-pre-line leading-relaxed border-t border-b py-3 my-3">
                        ${formatJobDescription(job.description)}
                    </div>

                    <div class="flex flex-wrap justify-between items-center gap-3">
                        <button onclick="openApplyModal('${job.id}', '${escapeHtml(job.title)}')" class="bg-blue-600 text-white text-sm font-medium px-4 py-2 rounded-lg hover:bg-blue-700 transition shadow-sm">
                            Apply Now
                        </button>

                        <div class="flex items-center gap-2">
                            <button onclick="viewApplications('${job.id}')" class="bg-indigo-600 text-white text-xs px-3 py-2 rounded-md hover:bg-indigo-700 flex items-center gap-1 font-medium shadow-sm">
                                👥 Applications (${appCount})
                            </button>
                            <button onclick="openEditModal('${job.id}')" class="bg-amber-50 text-amber-700 border border-amber-200 text-xs px-3 py-2 rounded-md hover:bg-amber-100 flex items-center gap-1 font-medium">
                                ✏️ Edit
                            </button>
                            <button onclick="toggleHoldJob('${job.id}')" class="bg-yellow-50 text-yellow-700 border border-yellow-200 text-xs px-3 py-2 rounded-md hover:bg-yellow-100 flex items-center gap-1 font-medium">
                                ${isHeld ? '▶️ Resume' : '⏸️ Hold'}
                            </button>
                            <button onclick="deleteJob('${job.id}')" class="bg-red-50 text-red-600 border border-red-200 text-xs px-3 py-2 rounded-md hover:bg-red-100 flex items-center gap-1 font-medium">
                                🗑️ Delete
                            </button>
                        </div>
                    </div>
                </div>
            `;
            }).join('');
        }

        function filterJobs() {
            const titleQuery = document.getElementById("search-title").value.toLowerCase();
            const locationQuery = document.getElementById("search-location").value.toLowerCase();
            const typeQuery = document.getElementById("filter-type").value;

            const filtered = jobsList.filter(job => {
                const matchTitle = job.title.toLowerCase().includes(titleQuery) || job.company.toLowerCase().includes(titleQuery);
                const matchLocation = job.location.toLowerCase().includes(locationQuery);
                const matchType = typeQuery === "" || job.type === typeQuery;
                return matchTitle && matchLocation && matchType;
            });

            renderJobs(filtered);
        }

        function resetFilters() {
            document.getElementById("search-title").value = "";
            document.getElementById("search-location").value = "";
            document.getElementById("filter-type").value = "";
            renderJobs(jobsList);
        }

        function formatJobDescription(text) {
            if (!text) return '';
            let cleanText = escapeHtml(text);
            return cleanText.replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-gray-900">$1</strong>');
        }

        // CRUD Operations
        async function deleteJob(id) {
            if (!confirm("Kya aap sach me is job ko delete karna chahte hain?")) return;
            jobsList = jobsList.filter(j => j.id != id);
            renderJobs(jobsList);
            if (supabaseClient) {
                try { await supabaseClient.from("jobs").delete().eq("id", id); } catch(err){}
            }
        }

        async function toggleHoldJob(id) {
            const job = jobsList.find(j => j.id == id);
            if (!job) return;
            job.status = job.status === 'hold' ? 'active' : 'hold';
            renderJobs(jobsList);
            if (supabaseClient) {
                try { await supabaseClient.from("jobs").update({ status: job.status }).eq("id", id); } catch(err){}
            }
        }

        function openModal() {
            document.getElementById("job-form").reset();
            document.getElementById("job-id").value = "";
            document.getElementById("modal-title").textContent = "Post a New Job";
            document.getElementById("job-modal").classList.remove("hidden");
        }

        function openEditModal(id) {
            const job = jobsList.find(j => j.id == id);
            if (!job) return;
            document.getElementById("job-id").value = job.id;
            document.getElementById("job-title-input").value = job.title;
            document.getElementById("job-company").value = job.company;
            document.getElementById("job-location").value = job.location;
            document.getElementById("job-type").value = job.type || "Full-Time";
            document.getElementById("job-description").value = job.description;
            document.getElementById("modal-title").textContent = "Edit Job Listing";
            document.getElementById("job-modal").classList.remove("hidden");
        }

        function closeModal() {
            document.getElementById("job-modal").classList.add("hidden");
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById("job-id").value;
            const jobData = {
                title: document.getElementById("job-title-input").value.trim(),
                company: document.getElementById("job-company").value.trim(),
                location: document.getElementById("job-location").value.trim(),
                type: document.getElementById("job-type").value,
                description: document.getElementById("job-description").value.trim(),
                created_at: new Date().toISOString()
            };

            if (id) {
                const index = jobsList.findIndex(j => j.id == id);
                if (index !== -1) jobsList[index] = { ...jobsList[index], ...jobData };
                if (supabaseClient) {
                    try { await supabaseClient.from("jobs").update(jobData).eq("id", id); } catch(e){}
                }
            } else {
                const newId = Date.now().toString();
                const newJob = { id: newId, status: 'active', ...jobData };
                jobsList.unshift(newJob);
                if (supabaseClient) {
                    try { await supabaseClient.from("jobs").insert([jobData]); } catch(e){}
                }
            }
            closeModal();
            renderJobs(jobsList);
        }

        // Application Flow Handlers
        function openApplyModal(jobId, jobTitle) {
            document.getElementById("apply-job-id").value = jobId;
            document.getElementById("apply-job-title").textContent = jobTitle;
            document.getElementById("apply-form").reset();
            document.getElementById("apply-modal").classList.remove("hidden");
        }

        function closeApplyModal() {
            document.getElementById("apply-modal").classList.add("hidden");
        }

        async function submitApplication(e) {
            e.preventDefault();
            const appData = {
                job_id: document.getElementById("apply-job-id").value,
                name: document.getElementById("applicant-name").value.trim(),
                email: document.getElementById("applicant-email").value.trim(),
                resume_link: document.getElementById("applicant-resume").value.trim(),
                applied_at: new Date().toISOString()
            };

            applicationsList.push(appData);
            if (supabaseClient) {
                try { await supabaseClient.from("applications").insert([appData]); } catch(e){}
            }

            closeApplyModal();
            alert("Application submitted successfully!");
            renderJobs(jobsList);
        }

        function viewApplications(jobId) {
            const filteredApps = applicationsList.filter(a => a.job_id == jobId);
            const container = document.getElementById("applications-list");

            if (filteredApps.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-gray-500">No applications received for this job yet.</div>`;
            } else {
                container.innerHTML = filteredApps.map(app => `
                    <div class="border rounded-lg p-4 bg-gray-50 flex justify-between items-center">
                        <div>
                            <h4 class="font-bold text-gray-800">${escapeHtml(app.name)}</h4>
                            <p class="text-xs text-gray-600">Email: <a href="mailto:${escapeHtml(app.email)}" class="text-blue-600 underline">${escapeHtml(app.email)}</a></p>
                            <p class="text-xs text-gray-400 mt-1">Applied on: ${new Date(app.applied_at).toLocaleDateString()}</p>
                        </div>
                        <a href="${escapeHtml(app.resume_link)}" target="_blank" class="bg-blue-600 text-white text-xs px-3 py-2 rounded hover:bg-blue-700 font-medium">
                            📄 View Resume
                        </a>
                    </div>
                `).join('');
            }
            document.getElementById("applications-modal").classList.remove("hidden");
        }

        function closeApplicationsModal() {
            document.getElementById("applications-modal").classList.add("hidden");
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
