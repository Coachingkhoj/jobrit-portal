<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobrit - Indeed Clone & Job Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK via unpkg -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 font-sans">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm p-4 flex justify-between items-center max-w-5xl mx-auto rounded-b-lg">
        <h1 class="text-2xl font-extrabold text-blue-600 cursor-pointer" onclick="switchView('jobs')">Jobrit <span class="text-xs bg-blue-100 text-blue-600 px-2 py-0.5 rounded-full">Pro</span></h1>
        <div id="navAuthArea" class="flex items-center gap-2">
            <button onclick="openAuthModal('login')" class="text-blue-600 font-medium px-3 py-1.5 text-sm hover:bg-blue-50 rounded-lg transition">Login</button>
            <button onclick="openAuthModal('signup')" class="bg-blue-600 text-white px-4 py-1.5 rounded-lg text-sm font-medium hover:bg-blue-700 transition">Sign Up</button>
        </div>
    </nav>

    <!-- Search & Filter Section (Only for Jobs View) -->
    <section id="searchSection" class="max-w-5xl mx-auto p-4 mt-6">
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col md:flex-row gap-3">
            <input type="text" id="searchInput" placeholder="Job title, keywords, or company..." onkeyup="filterJobs()" class="flex-1 border p-3 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="text" id="locationFilter" placeholder="Filter by City, Country, or Remote..." onkeyup="filterJobs()" class="flex-1 border p-3 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <select id="typeFilter" onchange="filterJobs()" class="border p-3 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">All Job Types</option>
                <option value="Full-Time">Full-Time</option>
                <option value="Contract">Contract</option>
                <option value="Remote">Remote</option>
            </select>
        </div>
    </section>

    <!-- Main Job Listings Container -->
    <main class="max-w-5xl mx-auto p-4">
        <div class="flex justify-between items-center mb-4">
            <h2 id="mainHeading" class="text-lg font-semibold text-gray-800">Recommended Jobs</h2>
            <button onclick="openModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition">+ Post a Job</button>
        </div>
        <div id="jobList" class="space-y-3">
            <p class="text-gray-500">Loading jobs...</p>
        </div>
    </main>

    <!-- Auth Modal (Login / Signup) -->
    <div id="authModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl max-w-sm w-full shadow-xl relative">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
            <h3 id="authModalTitle" class="text-xl font-bold mb-4 text-gray-800">Login to Jobrit</h3>
            <form id="authForm" onsubmit="handleAuth(event)" class="space-y-3">
                <input type="email" id="authEmail" placeholder="Email Address" required class="w-full border p-3 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="password" id="authPassword" placeholder="Password" required class="w-full border p-3 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button type="submit" id="authSubmitBtn" class="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 transition">Login</button>
            </form>
            <p id="authSwitchText" class="text-xs text-center text-gray-500 mt-4">
                Don't have an account? <span onclick="openAuthModal('signup')" class="text-blue-600 font-semibold cursor-pointer hover:underline">Sign Up</span>
            </p>
        </div>
    </div>

    <!-- Post Job Modal -->
    <div id="jobModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl max-w-md w-full shadow-xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
            <h3 class="text-xl font-bold mb-4 text-gray-800">Post a New Job</h3>
            <form id="jobForm" onsubmit="postJob(event)" class="space-y-3">
                <input type="text" id="title" placeholder="Job Title (e.g. Python Developer)" required class="w-full border p-3 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="text" id="company" placeholder="Company Name" required class="w-full border p-3 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="text" id="location" placeholder="Location (e.g. New York, London, Remote)" required class="w-full border p-3 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <select id="type" class="w-full border p-3 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="Full-Time">Full-Time</option>
                    <option value="Contract">Contract</option>
                    <option value="Remote">Remote</option>
                </select>
                <textarea id="description" placeholder="Job Description & Requirements..." rows="3" required class="w-full border p-3 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 transition">Submit Job</button>
            </form>
        </div>
    </div>

    <!-- Edit Job Modal -->
    <div id="editJobModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl max-w-md w-full shadow-xl relative">
            <button onclick="closeEditModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
            <h3 class="text-xl font-bold mb-4 text-gray-800">Edit Job Listing</h3>
            <form id="editJobForm" onsubmit="updateJob(event)" class="space-y-3">
                <input type="hidden" id="editJobId">
                <input type="text" id="editTitle" placeholder="Job Title" required class="w-full border p-3 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="text" id="editCompany" placeholder="Company Name" required class="w-full border p-3 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="text" id="editLocation" placeholder="Location" required class="w-full border p-3 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <select id="editType" class="w-full border p-3 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="Full-Time">Full-Time</option>
                    <option value="Contract">Contract</option>
                    <option value="Remote">Remote</option>
                </select>
                <textarea id="editDescription" placeholder="Job Description..." rows="3" required class="w-full border p-3 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                <button type="submit" id="editSubmitBtn" class="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 transition">Update Job</button>
            </form>
        </div>
    </div>

    <!-- Apply Job Modal -->
    <div id="applyModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl max-w-md w-full shadow-xl relative">
            <button onclick="closeApplyModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
            <h3 class="text-xl font-bold mb-1 text-gray-800">Apply for Job</h3>
            <p id="applyJobTitle" class="text-xs text-blue-600 font-semibold mb-4"></p>
            <form id="applyForm" onsubmit="submitApplication(event)" class="space-y-3">
                <input type="hidden" id="applyJobId">
                <input type="text" id="applicantName" placeholder="Full Name" required class="w-full border p-3 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="email" id="applicantEmail" placeholder="Email Address" required class="w-full border p-3 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <textarea id="applicantCover" placeholder="Short Cover Letter / Why should we hire you?" rows="3" required class="w-full border p-3 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Paste Resume / CV Link (Google Drive / LinkedIn):</label>
                    <input type="url" id="applicantResume" placeholder="https://..." required class="w-full border p-3 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" id="applySubmitBtn" class="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 transition">Submit Application</button>
            </form>
        </div>
    </div>

    <!-- View Applications Modal -->
    <div id="viewAppsModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl max-w-2xl w-full shadow-xl relative max-h-[80vh] overflow-y-auto">
            <button onclick="closeViewAppsModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
            <h3 class="text-xl font-bold mb-1 text-gray-800">Job Applications</h3>
            <p id="appsModalJobTitle" class="text-xs text-blue-600 font-semibold mb-4"></p>
            <div id="appsListContainer" class="space-y-3">
                <p class="text-gray-500 text-sm">Loading applications...</p>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const SUPABASE_URL = 'https://fksiepwvbygkcojvjyzy.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_nZ04GQ7-N30fI3xe67AOKw_tyd-9Xam';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let allJobsCache = [];
        let isSignUpMode = false;
        let currentUser = null;
        let currentView = 'jobs'; // 'jobs' or 'dashboard'

        async function initApp() {
            const { data: { session } } = await client.auth.getSession();
            if (session) {
                currentUser = session.user;
            }
            updateNavAndUI();
            fetchJobs();
        }

        async function updateNavAndUI() {
            const authArea = document.getElementById('navAuthArea');

            if (currentUser) {
                authArea.innerHTML = `
                    <button onclick="switchView('dashboard')" class="bg-blue-50 text-blue-600 px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-blue-100 transition">📊 My Dashboard</button>
                    <span class="text-xs text-gray-600 hidden md:inline font-medium">${currentUser.email}</span>
                    <button onclick="handleLogout()" class="bg-gray-100 text-gray-700 px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-gray-200 transition">Logout</button>
                `;
            } else {
                authArea.innerHTML = `
                    <button onclick="openAuthModal('login')" class="text-blue-600 font-medium px-3 py-1.5 text-sm hover:bg-blue-50 rounded-lg transition">Login</button>
                    <button onclick="openAuthModal('signup')" class="bg-blue-600 text-white px-4 py-1.5 rounded-lg text-sm font-medium hover:bg-blue-700 transition">Sign Up</button>
                `;
            }
        }

        function switchView(view) {
            currentView = view;
            const searchSection = document.getElementById('searchSection');
            const mainHeading = document.getElementById('mainHeading');

            if (view === 'dashboard') {
                if (!currentUser) {
                    alert('Please login first.');
                    openAuthModal('login');
                    return;
                }
                searchSection.classList.add('hidden');
                mainHeading.innerText = 'My Posted Jobs & Applications';
                fetchMyDashboardJobs();
            } else {
                searchSection.classList.remove('hidden');
                mainHeading.innerText = 'Recommended Jobs';
                fetchJobs();
            }
        }

        async function fetchJobs() {
            const listDiv = document.getElementById('jobList');
            const { data, error } = await client.from('jobs').select('*').order('created_at', { ascending: false });

            if (error) {
                listDiv.innerHTML = `<p class="text-red-500">Error loading jobs: ${error.message}</p>`;
                return;
            }

            allJobsCache = data || [];
            displayJobs(allJobsCache.filter(j => j.status !== 'paused'));
        }

        async function fetchMyDashboardJobs() {
            const listDiv = document.getElementById('jobList');
            const { data, error } = await client.from('jobs').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });

            if (error) {
                listDiv.innerHTML = `<p class="text-red-500">Error loading your jobs: ${error.message}</p>`;
                return;
            }

            displayDashboardJobs(data || []);
        }

        function displayJobs(jobs) {
            const listDiv = document.getElementById('jobList');

            if (!jobs || jobs.length === 0) {
                listDiv.innerHTML = `<div class="bg-white p-6 rounded-xl text-center text-gray-500 border border-gray-200">No jobs found.</div>`;
                return;
            }

            listDiv.innerHTML = jobs.map(job => `
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 hover:shadow-md transition">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="font-bold text-blue-600 text-lg">${job.title}</h3>
                            <p class="text-sm text-gray-700 font-semibold mt-0.5">${job.company} • <span class="text-gray-500 font-normal">${job.location}</span></p>
                        </div>
                        <span class="px-2.5 py-1 bg-blue-50 text-blue-600 text-xs font-medium rounded-full">${job.type}</span>
                    </div>
                    <p class="text-sm text-gray-600 mt-3 leading-relaxed">${job.description}</p>
                    <div class="mt-4 flex gap-2 items-center justify-between border-t pt-3 border-gray-100 flex-wrap">
                        <button onclick="openApplyModal('${job.id}', '${encodeURIComponent(job.title)}')" class="bg-blue-600 text-white px-4 py-1.5 rounded-lg text-xs font-medium hover:bg-blue-700 transition">Apply Now</button>
                    </div>
                </div>
            `).join('');
        }

        function displayDashboardJobs(jobs) {
            const listDiv = document.getElementById('jobList');

            if (!jobs || jobs.length === 0) {
                listDiv.innerHTML = `<div class="bg-white p-6 rounded-xl text-center text-gray-500 border border-gray-200">You haven't posted any jobs yet. Click "+ Post a Job" above!</div>`;
                return;
            }

            listDiv.innerHTML = jobs.map(job => {
                const isPaused = job.status === 'paused';
                return `
                <div class="bg-white p-5 rounded-xl shadow-sm border ${isPaused ? 'border-yellow-300 bg-yellow-50/20' : 'border-gray-200'} hover:shadow-md transition">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="flex items-center gap-2">
                                <h3 class="font-bold text-blue-600 text-lg">${job.title}</h3>
                                ${isPaused ? '<span class="px-2 py-0.5 bg-yellow-100 text-yellow-800 text-xs font-semibold rounded-full">Paused</span>' : ''}
                            </div>
                            <p class="text-sm text-gray-700 font-semibold mt-0.5">${job.company} • <span class="text-gray-500 font-normal">${job.location}</span></p>
                        </div>
                        <span class="px-2.5 py-1 bg-blue-50 text-blue-600 text-xs font-medium rounded-full">${job.type}</span>
                    </div>
                    <p class="text-sm text-gray-600 mt-3 leading-relaxed">${job.description}</p>
                    <div class="mt-4 flex gap-2 items-center justify-between border-t pt-3 border-gray-100 flex-wrap">
                        <button onclick="openViewAppsModal('${job.id}', '${encodeURIComponent(job.title)}')" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-medium hover:bg-indigo-700 transition">👥 View Applications</button>
                        
                        <div class="flex gap-2">
                            <button onclick='openEditModal(${JSON.stringify(job)})' class="bg-blue-50 text-blue-600 hover:bg-blue-100 font-medium text-xs px-3 py-1.5 rounded-lg transition border border-blue-200">✏️ Edit</button>
                            <button onclick="toggleHoldJob('${job.id}', '${job.status || 'active'}')" class="bg-yellow-50 text-yellow-700 hover:bg-yellow-100 font-medium text-xs px-3 py-1.5 rounded-lg transition border border-yellow-200">${isPaused ? '▶️ Resume' : '⏸️ Hold'}</button>
                            <button onclick="deleteJob('${job.id}')" class="bg-red-50 text-red-600 hover:bg-red-100 font-medium text-xs px-3 py-1.5 rounded-lg transition border border-red-200">🗑️ Delete</button>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        async function toggleHoldJob(jobId, currentStatus) {
            const newStatus = currentStatus === 'paused' ? 'active' : 'paused';
            const { error } = await client.from('jobs').update({ status: newStatus }).eq('id', jobId);

            if (error) {
                alert('Error updating status: ' + error.message);
            } else {
                fetchMyDashboardJobs();
            }
        }

        async function deleteJob(jobId) {
            if (!confirm('Are you sure you want to delete this job posting?')) return;

            const { error } = await client.from('jobs').delete().eq('id', jobId);

            if (error) {
                alert('❌ Error deleting job: ' + error.message);
            } else {
                alert('🗑️ Job deleted successfully!');
                fetchMyDashboardJobs();
            }
        }

        // Edit Job Handlers
        function openEditModal(job) {
            document.getElementById('editJobId').value = job.id;
            document.getElementById('editTitle').value = job.title;
            document.getElementById('editCompany').value = job.company;
            document.getElementById('editLocation').value = job.location;
            document.getElementById('editType').value = job.type;
            document.getElementById('editDescription').value = job.description;
            document.getElementById('editJobModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editJobModal').classList.add('hidden');
        }

        async function updateJob(e) {
            e.preventDefault();
            const btn = document.getElementById('editSubmitBtn');
            btn.disabled = true;
            btn.innerText = 'Updating...';

            const jobId = document.getElementById('editJobId').value;
            const updatedData = {
                title: document.getElementById('editTitle').value,
                company: document.getElementById('editCompany').value,
                location: document.getElementById('editLocation').value,
                type: document.getElementById('editType').value,
                description: document.getElementById('editDescription').value
            };

            const { error } = await client.from('jobs').update(updatedData).eq('id', jobId);

            if (error) {
                alert('Error updating job: ' + error.message);
            } else {
                alert('✏️ Job updated successfully!');
                closeEditModal();
                fetchMyDashboardJobs();
            }

            btn.disabled = false;
            btn.innerText = 'Update Job';
        }

        // View Applications Handlers
        async function openViewAppsModal(jobId, encodedTitle) {
            const jobTitle = decodeURIComponent(encodedTitle);
            document.getElementById('appsModalJobTitle').innerText = `For Position: ${jobTitle}`;
            document.getElementById('viewAppsModal').classList.remove('hidden');
            
            const container = document.getElementById('appsListContainer');
            container.innerHTML = `<p class="text-gray-500 text-sm">Loading applications...</p>`;

            const { data, error } = await client.from('applications').select('*').eq('job_id', jobId).order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = `<p class="text-red-500 text-sm">Error loading applications: ${error.message}</p>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-sm">No applications received for this job yet.</p>`;
                return;
            }

            container.innerHTML = data.map(app => `
                <div class="bg-gray-50 border border-gray-200 p-4 rounded-xl space-y-2">
                    <div class="flex justify-between items-center">
                        <h4 class="font-bold text-gray-800 text-sm">${app.full_name}</h4>
                        <a href="${app.resume_link}" target="_blank" class="bg-blue-600 text-white px-3 py-1 rounded-lg text-xs font-medium hover:bg-blue-700 transition">📄 View Resume</a>
                    </div>
                    <p class="text-xs text-gray-600"><strong>Email:</strong> ${app.email}</p>
                    <p class="text-xs text-gray-700 bg-white p-2.5 rounded-lg border border-gray-100"><strong>Cover Letter:</strong> ${app.cover_letter}</p>
                </div>
            `).join('');
        }

        function closeViewAppsModal() {
            document.getElementById('viewAppsModal').classList.add('hidden');
        }

        function filterJobs() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const locationVal = document.getElementById('locationFilter').value.toLowerCase();
            const typeVal = document.getElementById('typeFilter').value;

            const filtered = allJobsCache.filter(job => {
                if (job.status === 'paused') return false;
                const matchSearch = job.title.toLowerCase().includes(searchText) || 
                                    job.company.toLowerCase().includes(searchText) || 
                                    job.description.toLowerCase().includes(searchText);
                const matchLocation = locationVal === "" || job.location.toLowerCase().includes(locationVal);
                const matchType = typeVal === "" || job.type === typeVal;

                return matchSearch && matchLocation && matchType;
            });

            displayJobs(filtered);
        }

        function openAuthModal(mode) {
            isSignUpMode = (mode === 'signup');
            document.getElementById('authModalTitle').innerText = isSignUpMode ? 'Create Jobrit Account' : 'Login to Jobrit';
            document.getElementById('authSubmitBtn').innerText = isSignUpMode ? 'Sign Up' : 'Login';
            document.getElementById('authSwitchText').innerHTML = isSignUpMode ? 
                'Already have an account? <span onclick="openAuthModal(\'login\')" class="text-blue-600 font-semibold cursor-pointer hover:underline">Login</span>' : 
                'Don\'t have an account? <span onclick="openAuthModal(\'signup\')" class="text-blue-600 font-semibold cursor-pointer hover:underline">Sign Up</span>';
            document.getElementById('authModal').classList.remove('hidden');
        }

        function closeAuthModal() { document.getElementById('authModal').classList.add('hidden'); }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const btn = document.getElementById('authSubmitBtn');
            btn.disabled = true;

            if (isSignUpMode) {
                const { error } = await client.auth.signUp({ email, password });
                if (error) {
                    alert('Signup Error: ' + error.message);
                } else {
                    alert('🎉 Account created successfully! You can now log in.');
                    openAuthModal('login');
                }
            } else {
                const { data, error } = await client.auth.signInWithPassword({ email, password });
                if (error) {
                    alert('Login Error: ' + error.message);
                } else {
                    currentUser = data.user;
                    alert('🎉 Logged in successfully!');
                    closeAuthModal();
                    updateNavAndUI();
                    switchView('jobs');
                }
            }
            btn.disabled = false;
        }

        async function handleLogout() {
            await client.auth.signOut();
            currentUser = null;
            updateNavAndUI();
            switchView('jobs');
            alert('Logged out successfully.');
        }

        function openModal() { 
            if (!currentUser) {
                alert('Please login first to post a job.');
                openAuthModal('login');
                return;
            }
            document.getElementById('jobModal').classList.remove('hidden'); 
        }
        function closeModal() { document.getElementById('jobModal').classList.add('hidden'); }

        async function postJob(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'Posting...';

            const newJob = {
                title: document.getElementById('title').value,
                company: document.getElementById('company').value,
                location: document.getElementById('location').value,
                type: document.getElementById('type').value,
                description: document.getElementById('description').value,
                user_id: currentUser.id,
                status: 'active'
            };

            const { error } = await client.from('jobs').insert([newJob]);

            if (error) {
                alert('Error: ' + error.message);
            } else {
                alert('🎉 Job posted successfully!');
                closeModal();
                document.getElementById('jobForm').reset();
                if (currentView === 'dashboard') fetchMyDashboardJobs();
                else fetchJobs();
            }

            btn.disabled = false;
            btn.innerText = 'Submit Job';
        }

        function openApplyModal(jobId, encodedTitle) {
            const jobTitle = decodeURIComponent(encodedTitle);
            document.getElementById('applyJobId').value = jobId;
            document.getElementById('applyJobTitle').innerText = `Applying for: ${jobTitle}`;
            document.getElementById('applyModal').classList.remove('hidden');
        }

        function closeApplyModal() { document.getElementById('applyModal').classList.add('hidden'); }

        async function submitApplication(e) {
            e.preventDefault();
            const btn = document.getElementById('applySubmitBtn');
            btn.disabled = true;
            btn.innerText = 'Submitting...';

            const applicationData = {
                job_id: document.getElementById('applyJobId').value,
                full_name: document.getElementById('applicantName').value,
                email: document.getElementById('applicantEmail').value,
                cover_letter: document.getElementById('applicantCover').value,
                resume_link: document.getElementById('applicantResume').value
            };

            const { error } = await client.from('applications').insert([applicationData]);

            if (error) {
                alert('❌ Error submitting application: ' + error.message);
            } else {
                alert('🎉 Application submitted successfully!');
                closeApplyModal();
                document.getElementById('applyForm').reset();
            }

            btn.disabled = false;
            btn.innerText = 'Submit Application';
        }

        initApp();
    </script>
</body>
</html>
